name: Release
on:
  push:
    tags:
      - v*
      - '[0-9]+.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Get tag name
        id: extract
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version_name="${tag#v}"

          if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must be semver-like (e.g. v1.2.3 or 1.2.3). Got: $tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://$GH_PAT@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools build-tools;35.0.1'
          log-accepted-android-sdk-licenses: false

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]]; then
            mkdir -p app/src/main/assets
            printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done

          umask 077
          keystore_path="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

          # Supply signing only on the runner, without editing the project build files.
          cat > "$RUNNER_TEMP/release-signing.gradle" <<'GRADLE'
          allprojects { project ->
              project.plugins.withId('com.android.application') {
                  if (project.path == ':app') {
                      project.extensions.getByName('androidComponents').finalizeDsl({ android ->
                          def signing = android.signingConfigs.maybeCreate('githubActionsRelease')
                          signing.storeFile = project.file(System.getenv('ANDROID_KEYSTORE_PATH'))
                          signing.storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                          signing.keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                          signing.keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
                          android.buildTypes.getByName('release').signingConfig = signing
                      } as org.gradle.api.Action)
                  }
              }
          }
          GRADLE

      - name: Clean CMake cache
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build
        env:
          VERSION_NAME: ${{ steps.extract.outputs.version_name }}
          VERSION_CODE: ${{ steps.extract.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --init-script "$RUNNER_TEMP/release-signing.gradle" assembleRelease -Penable-updater \
            "-PreleaseVersionName=$VERSION_NAME" "-PreleaseVersionCode=$VERSION_CODE"

      - name: Verify signed APKs
        run: |
          set -euo pipefail
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose \
              "app/build/outputs/apk/release/app-$abi-release.apk"
          done

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk "chimahon-$RELEASE_TAG.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "chimahon-arm64-v8a-$RELEASE_TAG.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "chimahon-armeabi-v7a-$RELEASE_TAG.apk"
          mv app/build/outputs/apk/release/app-x86-release.apk "chimahon-x86-$RELEASE_TAG.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "chimahon-x86_64-$RELEASE_TAG.apk"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chimahon
          if-no-files-found: error
          path: |
            chimahon-${{ steps.extract.outputs.tag }}.apk
            chimahon-arm64-v8a-${{ steps.extract.outputs.tag }}.apk
            chimahon-armeabi-v7a-${{ steps.extract.outputs.tag }}.apk
            chimahon-x86-${{ steps.extract.outputs.tag }}.apk
            chimahon-x86_64-${{ steps.extract.outputs.tag }}.apk

      - name: Generate release notes from CHANGELOG
        env:
          VERSION_NAME: ${{ steps.extract.outputs.version_name }}
          RELEASE_TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -e

          version_name="$VERSION_NAME"

          changelog_section=$(awk -v v="$version_name" '
            $0 ~ "^## \\\[(v?" v ")\\\]" { found = 1; next }
            found && $0 ~ "^## \\\[" { exit }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "$changelog_section" ]]; then
            changelog_section=$(awk '
              $0 ~ "^## \\\[Unreleased\\\]" { found = 1; next }
              found && $0 ~ "^## \\\[" { exit }
              found { print }
            ' CHANGELOG.md)
          fi

          if [[ -n "$changelog_section" ]]; then
            {
              echo "$changelog_section"
            } > release_notes.md
          else
            {
              echo "Release $RELEASE_TAG"
              echo
              echo "No matching section found in CHANGELOG.md for version $version_name."
            } > release_notes.md
          fi
          echo -e "\n<!-->" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.extract.outputs.tag }}
          name: Chimahon ${{ steps.extract.outputs.tag }}
          body_path: release_notes.md
          files: |
            chimahon-${{ steps.extract.outputs.tag }}.apk
            chimahon-arm64-v8a-${{ steps.extract.outputs.tag }}.apk
            chimahon-armeabi-v7a-${{ steps.extract.outputs.tag }}.apk
            chimahon-x86-${{ steps.extract.outputs.tag }}.apk
            chimahon-x86_64-${{ steps.extract.outputs.tag }}.apk
          draft: true
          prerelease: false

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release-signing.gradle"
